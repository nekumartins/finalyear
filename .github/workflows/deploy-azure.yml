name: Deploy To Azure VM

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Run tests before deploying ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m pytest backend/tests/ -x -k "not edge and not integration" --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ secrets.AZURE_SSH_HOST }}" ] || (echo "Missing AZURE_SSH_HOST secret" && exit 1)
          [ -n "${{ secrets.AZURE_SSH_USER }}" ] || (echo "Missing AZURE_SSH_USER secret" && exit 1)
          [ -n "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" ] || (echo "Missing AZURE_SSH_PRIVATE_KEY secret" && exit 1)

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          SSH_PORT="${{ secrets.AZURE_SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT="22"; fi

          if [ -n "${{ secrets.AZURE_SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.AZURE_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.AZURE_SSH_HOST }}" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        run: |
          set -euo pipefail

          SSH_HOST="${{ secrets.AZURE_SSH_HOST }}"
          SSH_USER="${{ secrets.AZURE_SSH_USER }}"
          SSH_PORT="${{ secrets.AZURE_SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT="22"; fi

          APP_DIR="${{ secrets.AZURE_APP_DIR }}"
          if [ -z "$APP_DIR" ]; then APP_DIR="/home/${SSH_USER}/finalyear"; fi

          DEPLOY_BRANCH="${{ github.ref_name }}"

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
            "APP_DIR='${APP_DIR}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$APP_DIR"
          git fetch origin

          if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
            git checkout "$DEPLOY_BRANCH"
          else
            git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          fi

          # Reset to remote state (safe — .env is gitignored, server has no local edits)
          git reset --hard "origin/$DEPLOY_BRANCH"

          # Rebuild and restart containers
          docker compose -f docker-compose.prod.yml up -d --build

          # Clean up dangling images to save disk space
          docker image prune -f

          # Show running state
          docker compose -f docker-compose.prod.yml ps
          echo "Deploy complete: $(git log --oneline -1)"
          EOF
