# ─────────────────────────────────────────────────────────────────────────────
# Debate Coach — Docker Compose (PRODUCTION)
#
# Starts two services:
#   postgres  — Postgres 16, persistent volume
#   backend   — FastAPI serving also the pre-built Vite bundle (single container)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#   make prod
#
# Access:
#   App  →  http://localhost:8000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: debate-coach-db
    environment:
      POSTGRES_USER: debate
      POSTGRES_PASSWORD: debate_pass
      POSTGRES_DB: debate_coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate -d debate_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend + bundled Frontend (single container) ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: debate-coach-app
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m backend.app.db.init_db &&
             python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://debate:debate_pass@postgres:5432/debate_coach
      DEBUG: "false"
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
